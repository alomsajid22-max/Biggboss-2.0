name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not configured."
            exit 1
          fi
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          JAVA_VER_RAW="$(echo "$JAVA_VER_LINE" | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$JAVA_VER_RAW" == 1.* ]]; then
            JAVA_MAJOR="$(echo "$JAVA_VER_RAW" | cut -d'.' -f2)"
          else
            JAVA_MAJOR="$(echo "$JAVA_VER_RAW" | cut -d'.' -f1)"
          fi
          echo "Active Java major version: ${JAVA_MAJOR:-unknown}"
          if [[ ! "${JAVA_MAJOR:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to detect active Java major version from: ${JAVA_VER_LINE}"
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary ./debug.keystore already exists; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "${KEYTOOL_BIN}" ]; then
              echo "::error::keytool executable not found in configured Java 17 installation (${KEYTOOL_BIN})."
              exit 1
            fi
            "${KEYTOOL_BIN}" -genkeypair -noprompt \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary ./debug.keystore could not be created or is empty."
            exit 1
          fi
          echo "Verified ./debug.keystore is present."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi
          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi
          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi
          echo "Verified debug APK: ${EXPECTED_APK}"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified debug APK missing at ${SOURCE_APK}."
            exit 1
          fi
          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO="$(printf '%s' "${RAW_REPO}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')"
          if [ -z "${SAFE_REPO}" ]; then
            SAFE_REPO="android-app"
          fi
          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-apk-XXXXXX")"
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"
          cp "${SOURCE_APK}" "${ASSET_PATH}"
          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Failed to prepare valid .apk release asset at ${ASSET_PATH}."
            exit 1
          fi
          echo "Prepared release asset: ${ASSET_NAME}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          gh --version
          if [ -z "${ASSET_PATH}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid; aborting release creation."
            exit 1
          fi
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          cat > "${NOTES_FILE}" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Artifact Filename:** \`${ASSET_NAME}\`

          **Notice:** This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes-file "${NOTES_FILE}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"

      - name: Report APK download result
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            gh release view "${RELEASE_TAG}"
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            {
              echo "### Debug APK Build & GitHub Release Published"
              echo "- **APK Build & Artifact Upload (\`app-debug-apk\`):** Succeeded"
              echo "- **GitHub Release Status:** Published"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "Download the APK directly from the **Assets** section on the GitHub Release page above. The GitHub Actions artifact \`app-debug-apk\` is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          elif [ "${PUBLISH_OUTCOME}" = "failure" ]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            echo "APK Build Status: Succeeded"
            echo "Actions Artifact Backup: app-debug-apk"
            {
              echo "### Warning: GitHub Release Publishing Failed (Actions Artifact Still Available)"
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact Backup (\`app-debug-apk\`):** Available for download from this workflow run's Artifacts section."
              echo "- **GitHub Release Status:** Failed — check the \`Publish APK to GitHub Releases\` step logs for details."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Release publishing was skipped (upload outcome: ${UPLOAD_OUTCOME}). Check earlier build or verification steps."
            {
              echo "### Debug APK Workflow Did Not Reach Release Publishing"
              echo "- **Artifact Upload Outcome:** \`${UPLOAD_OUTCOME}\`"
              echo "- **Release Step Outcome:** \`${PUBLISH_OUTCOME}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
